<section id="contact">
    <div class="container">
        <div class="text-center">
            <h2 class="section-heading">Say hello</h2>
            <p class="contact-prompt">Reach out directly or find us on social.</p>
        </div>
        <div class="contact-grid">
            <a href="https://www.facebook.com/{{ site.facebook_username }}" class="contact-link" target="_blank" rel="noopener noreferrer">
                <span class="contact-icon" aria-hidden="true"><i class="fa fa-facebook"></i></span>
                <p>{{ site.facebook_username }}</p>
            </a>
            <a href="mailto:{{ site.email }}" class="contact-link">
                <span class="contact-icon" aria-hidden="true"><i class="fa fa-envelope-o"></i></span>
                <p>{{ site.email }}</p>
            </a>
            <a href="https://instagram.com/{{ site.instagram_username }}" class="contact-link" target="_blank" rel="noopener noreferrer">
                <span class="contact-icon" aria-hidden="true"><i class="fa fa-instagram"></i></span>
                <p>{{ site.instagram_username }}</p>
            </a>
        </div>
    </div>
</section>
