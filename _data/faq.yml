# Shown in the FAQ section, in this order.
- question: How much does it cost?
  answer: Every home is different, so we start with a free estimate. Fill out the estimate form and we'll put together a custom lighting plan for you.

- question: Do I need to buy my own lights?
  answer: Nope. We supply professional-grade Christmas lights as part of our service, so there's nothing for you to buy.

- question: What's included?
  answer: Everything. A design consultation, professional-grade lights, installation, maintenance through the season, and removal in the new year, all at no extra cost.

- question: What if a bulb goes out?
  answer: No need to worry. Maintaining your lights is part of the job, so just let us know and we'll take care of it.

- question: When do you take the lights down?
  answer: Sometime in the new year. Just tell us when, and we'll come back and remove everything.

- question: Do you light up businesses too?
  answer: Yes! We transform homes and businesses alike.

- question: What areas do you serve?
  answer: We're based in Moscow, Idaho and serve Moscow, Pullman, and the surrounding Palouse communities.
